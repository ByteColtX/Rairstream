[package]
name = "rairstream"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
authors = ["bytecolt"]
repository = "https://github.com/ByteColtX/Rairstream"
rust-version = "1.85"

[package.metadata.release]
allow-branch = ["main"]
publish = false
push-remote = "origin"
tag-name = "v{{version}}"
tag-message = "Release {{crate_name}} {{version}}"
pre-release-commit-message = "chore: release {{crate_name}} {{version}}"

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
anyhow = "1.0.100"
base64ct = { version = "1.8.3", features = ["alloc"] }
chacha20poly1305 = "0.10.1"
ctr = "0.9.2"
ctrlc = "3.5.0"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hkdf = "0.12.4"
mdns-sd = "0.19.0"
num-traits = "0.2.19"
plist = "1.8.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sha2 = "0.10.9"
srp = "0.7.0-rc.3"
symphonia = { version = "0.5.5", features = ["all"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
x25519-dalek = "2.0.1"

[target.'cfg(windows)'.dependencies]
native-dialog = "0.9.6"
tray-icon = { version = "0.23.1", default-features = false }
wasapi = "0.23.0"
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
winit = { version = "0.30.12", default-features = false }

[build-dependencies]
ico = "0.5.0"
num-traits = "0.2.19"
resvg = "0.45.1"
winresource = "0.1.31"

[dev-dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "deny"
