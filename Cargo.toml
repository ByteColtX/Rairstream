[workspace]
members = [
    "apps/rairstream-desktop",
    "crates/rairstream-airplay",
    "crates/rairstream-audio-capture",
    "crates/rairstream-config",
    "crates/rairstream-core",
    "crates/rairstream-device-discovery",
    "crates/rairstream-platform",
    "crates/rairstream-session",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["bytecolt"]
repository = ""
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.41"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
